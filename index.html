<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 · 由黄到红</title>
<style>
  :root {
    --bg: #16110c;
    --board: #2b2119;
    --cell: rgba(255, 255, 255, 0.05);
    --gap: 12px;
    --pad: 12px;
    --text: #f3e7d9;
    --muted: #a08f7d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(255, 160, 40, 0.16), transparent 70%),
      radial-gradient(50% 40% at 85% 100%, rgba(220, 40, 20, 0.14), transparent 70%),
      var(--bg);
    user-select: none;
  }

  .app { width: min(92vw, 440px); }

  /* ---------- 顶部 ---------- */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 40px;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(100deg, #ffd75e 0%, #ff9f2e 45%, #ef3d1f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle { margin: 8px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .5px; }

  .scores { display: flex; gap: 8px; }

  .score-box {
    min-width: 74px;
    padding: 7px 10px 8px;
    border-radius: 10px;
    text-align: center;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }

  .score-box span { display: block; font-size: 10px; letter-spacing: 1px; color: var(--muted); }
  .score-box strong { display: block; margin-top: 2px; font-size: 19px; font-variant-numeric: tabular-nums; }

  .score-box strong.bump { animation: bump .22s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 45% { transform: scale(1.22); color: #ffb04d; } 100% { transform: scale(1); } }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    transition: transform .12s ease, filter .18s ease, box-shadow .18s ease;
  }
  button:active { transform: scale(.96); }

  #new-game {
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 700;
    color: #3a1c05;
    background: linear-gradient(135deg, #ffd75e, #ff9f2e 55%, #f2542d);
    box-shadow: 0 6px 18px -8px rgba(255, 140, 40, .9);
  }
  #new-game:hover { filter: brightness(1.07); }

  .legend { display: flex; flex-direction: column; gap: 4px; flex: 1; max-width: 190px; }
  .legend-bar {
    height: 8px;
    border-radius: 99px;
    background: linear-gradient(90deg, hsl(52 85% 80%), hsl(40 85% 68%), hsl(26 85% 60%), hsl(12 85% 54%), hsl(0 85% 48%));
  }
  .legend-text { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }

  /* ---------- 棋盘 ---------- */
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: var(--pad);
    border-radius: 18px;
    background: var(--board);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.04),
      0 24px 60px -30px #000;
    touch-action: none;
  }

  .grid-bg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--gap);
    width: 100%;
    height: 100%;
  }
  .grid-bg div { background: var(--cell); border-radius: 10px; }

  .tiles {
    position: absolute;
    inset: var(--pad);
    --s: 90px; /* 由 JS 按实际宽度换算成像素 */
  }

  .tile {
    position: absolute;
    width: var(--s);
    height: var(--s);
    left: calc(var(--c) * (var(--s) + var(--gap)));
    top: calc(var(--r) * (var(--s) + var(--gap)));
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    font-size: calc(var(--s) * 0.42);
    color: #43260c;
    background: hsl(var(--h) 85% var(--l));
    box-shadow: 0 6px 16px -10px rgba(0, 0, 0, .8);
    transition: left .16s ease, top .16s ease, width .22s ease, height .22s ease, background-color .2s ease;
    will-change: left, top;
  }
  .tile[data-digits="3"] { font-size: calc(var(--s) * 0.34); }
  .tile[data-digits="4"] { font-size: calc(var(--s) * 0.27); }
  .tile[data-digits="5"] { font-size: calc(var(--s) * 0.23); }

  @keyframes appear { from { transform: scale(.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tile.appear { animation: appear .16s ease-out; }

  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .tile.pop { animation: pop .18s ease-out; }

  /* ---------- 遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: rgba(22, 16, 10, .76);
    backdrop-filter: blur(5px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .panel { text-align: center; padding: 20px; }
  .panel h2 { margin: 0 0 6px; font-size: 26px; }
  .panel p { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
  .panel button {
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 700;
    color: #3a1c05;
    background: linear-gradient(135deg, #ffd75e, #ff9f2e 55%, #f2542d);
  }

  .hint { margin: 16px 0 0; text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .4px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translate(-50%, 12px);
    padding: 9px 18px;
    font-size: 13px;
    color: var(--text);
    background: rgba(50, 38, 26, .94);
    border: 1px solid rgba(255, 170, 60, .35);
    border-radius: 99px;
    box-shadow: 0 12px 30px -14px #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>2048</h1>
        <p class="subtitle">数字越大，颜色越靠近红色</p>
      </div>
      <div class="scores">
        <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
      </div>
    </header>

    <div class="toolbar">
      <button id="new-game">新游戏</button>
      <div class="legend">
        <div class="legend-bar"></div>
        <div class="legend-text"><span>2</span><span>32</span><span>256</span><span>2048</span></div>
      </div>
    </div>

    <div class="board" id="board">
      <div class="grid-bg" id="grid-bg"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="ov-title">游戏结束</h2>
          <p id="ov-sub"></p>
          <button id="ov-btn">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint">方向键 / WASD 移动 · 手机上下左右滑动 · 最大数字到 65k 升级 5×5</p>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  const BASE_SIZE = 4;
  const MAX_SIZE = 5;
  const UPGRADE_VALUE = 65536; // 显示为 65k
  let SIZE = BASE_SIZE;
  const BEST_KEY = 'game-2048-best';

  const tilesEl = document.getElementById('tiles');
  const gridBg = document.getElementById('grid-bg');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovSub = document.getElementById('ov-sub');
  const ovBtn = document.getElementById('ov-btn');
  const boardEl = document.getElementById('board');

  let uid = 0;
  let grid = [];
  let score = 0;
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  let busy = false;
  let over = false;

  /* ---------- 颜色：2 黄 -> 2048 及以上红 ---------- */
  function tileHueLight(value) {
    const t = Math.min((Math.log2(value) - 1) / 10, 1); // 2 => 0, 2048 => 1
    return { h: 52 - 52 * t, l: 80 - 32 * t };            // hsl(h 85% l)
  }

  function formatValue(value) {
    return value >= 10000 ? Math.floor(value / 1000) + 'k' : String(value);
  }

  function paint(el, value) {
    const { h, l } = tileHueLight(value);
    const text = formatValue(value);
    el.style.setProperty('--h', h.toFixed(1));
    el.style.setProperty('--l', l.toFixed(1) + '%');
    el.style.color = l > 66 ? '#43260c' : '#fff8f0';
    el.dataset.digits = text.length;
    el.textContent = text;
  }

  /* ---------- 基础渲染 ---------- */
  function buildBackground() {
    gridBg.innerHTML = '';
    gridBg.style.gridTemplateColumns = 'repeat(' + SIZE + ', 1fr)';
    for (let i = 0; i < SIZE * SIZE; i++) gridBg.appendChild(document.createElement('div'));
  }

  function newTile(r, c, value, isNew) {
    const tile = { id: ++uid, value, r, c, el: null };
    const el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' appear' : '');
    el.style.setProperty('--r', r);
    el.style.setProperty('--c', c);
    paint(el, value);
    tilesEl.appendChild(el);
    tile.el = el;
    grid[r][c] = tile;
    return tile;
  }

  function setPos(tile, r, c) {
    tile.r = r;
    tile.c = c;
    tile.el.style.setProperty('--r', r);
    tile.el.style.setProperty('--c', c);
  }

  function spawnRandom() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) if (!grid[r][c]) empty.push([r, c]);
    }
    if (!empty.length) return null;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    return newTile(r, c, 2, true);
  }

  function updateScore(gained) {
    score += gained;
    scoreEl.textContent = score;
    if (gained > 0) {
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
    }
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem(BEST_KEY, best);
    }
  }

  /* ---------- 移动逻辑 ---------- */
  function getLines(dir) {
    const lines = [];
    const horizontal = dir === 'left' || dir === 'right';
    for (let i = 0; i < SIZE; i++) {
      const line = [];
      for (let j = 0; j < SIZE; j++) {
        const k = (dir === 'left' || dir === 'up') ? j : SIZE - 1 - j;
        line.push(horizontal ? [i, k] : [k, i]);
      }
      lines.push(line);
    }
    return lines;
  }

  function move(dir) {
    if (busy || over) return;

    let moved = false;
    let gained = 0;
    const merges = [];

    for (const line of getLines(dir)) {
      const seq = line.map(([r, c]) => grid[r][c]).filter(Boolean);
      for (const [r, c] of line) grid[r][c] = null;

      const results = [];
      for (const t of seq) {
        const last = results[results.length - 1];
        if (last && !last.merged && last.value === t.value) {
          last.merged = true;
          last.value *= 2;
          last.tiles.push(t);
        } else {
          results.push({ value: t.value, tiles: [t], merged: false });
        }
      }

      results.forEach((res, i) => {
        const [r, c] = line[i];
        const survivor = res.tiles[0];
        if (survivor.r !== r || survivor.c !== c) moved = true;

        setPos(survivor, r, c);
        grid[r][c] = survivor;

        if (res.merged) {
          const extra = res.tiles[1];
          moved = true;
          gained += res.value;
          setPos(extra, r, c);
          extra.el.style.zIndex = 2;
          merges.push({ survivor, extra, value: res.value });
        }
      });
    }

    if (!moved) return;

    busy = true;
    updateScore(gained);

    setTimeout(() => {
      for (const m of merges) {
        m.extra.el.remove();
        m.survivor.value = m.value;
        paint(m.survivor.el, m.value);
        m.survivor.el.classList.remove('pop');
        void m.survivor.el.offsetWidth;
        m.survivor.el.classList.add('pop');
      }

      spawnRandom();
      busy = false;
      tryUpgrade();
      checkState();
    }, 135);
  }

  /* ---------- 状态判定 ---------- */
  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const t = grid[r][c];
        if (!t) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
      }
    }
    return false;
  }

  function showOverlay(title, sub, btn, action) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    ovBtn.textContent = btn;
    ovBtn.onclick = action;
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  function checkState() {
    if (!canMove()) {
      over = true;
      showOverlay('游戏结束', '最终得分 ' + score + '，没位置可走了', '再来一局', newGame);
    }
  }

  /* ---------- 新游戏 ---------- */
  function updateTileSize() {
    const gap = parseFloat(getComputedStyle(tilesEl).getPropertyValue('--gap')) || 12;
    const size = (tilesEl.clientWidth - (SIZE - 1) * gap) / SIZE;
    if (size > 0) tilesEl.style.setProperty('--s', size + 'px');
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  /* ---------- 最大数字首次到 65k：4×4 缩到右下角，左/上新增一格变 5×5 ---------- */
  function tryUpgrade() {
    if (SIZE >= MAX_SIZE) return;

    let reached = false;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] && grid[r][c].value >= UPGRADE_VALUE) reached = true;
      }
    }
    if (!reached) return;

    const old = grid;
    SIZE = MAX_SIZE;
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

    // 旧瓦片整体右下移一格，顶部与左侧空出新格
    for (let r = 0; r < old.length; r++) {
      for (let c = 0; c < old[r].length; c++) {
        const t = old[r][c];
        if (!t) continue;
        grid[r + 1][c + 1] = t;
        setPos(t, r + 1, c + 1);
      }
    }

    buildBackground();
    updateTileSize();
    toast('最大数字达到 65k，棋盘升级为 5×5！');
  }

  function newGame() {
    SIZE = BASE_SIZE;
    tilesEl.innerHTML = '';
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    buildBackground();
    updateTileSize();
    score = 0;
    busy = false;
    over = false;
    scoreEl.textContent = '0';
    bestEl.textContent = best;
    hideOverlay();
    spawnRandom();
    spawnRandom();
  }

  /* ---------- 输入 ---------- */
  const KEY_MAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };

  window.addEventListener('keydown', (e) => {
    const dir = KEY_MAP[e.key];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  let touchStart = null;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  document.getElementById('new-game').addEventListener('click', newGame);

  window.addEventListener('resize', updateTileSize);
  updateTileSize();
  newGame();
})();
</script>
</body>
</html>
