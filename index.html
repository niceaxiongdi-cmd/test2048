<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 · 由黄到红</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>2048</h1>
        <p class="subtitle">数字越大，颜色越靠近红色</p>
      </div>
      <div class="scores">
        <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-actions">
        <button id="new-game">新游戏</button>
        <button id="undo" disabled>回退一步</button>
      </div>
      <div class="legend">
        <div class="legend-bar"></div>
        <div class="legend-text"><span>2</span><span>32</span><span>256</span><span>2048</span></div>
      </div>
    </div>

    <div class="board" id="board">
      <div class="grid-bg" id="grid-bg"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="ov-title">游戏结束</h2>
          <p id="ov-sub"></p>
          <button id="ov-btn">再来一局</button>
        </div>
      </div>
    </div>

    <p class="hint">方向键 / WASD 移动 · 手机上下左右滑动 · 最大数字到 65k 升级 5×5</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/game.js"></script>
</body>
</html>
